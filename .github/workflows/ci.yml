# Quality gate for every push and pull request (IMPLEMENTATION_PLAN.md T-10).
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: darsi
          POSTGRES_PASSWORD: darsi
          POSTGRES_DB: darsi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darsi -d darsi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Integration and e2e suites run against this database; Redis and Telegram are faked in tests.
      DATABASE_URL_TEST: postgresql://darsi:darsi@localhost:5432/darsi_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # postinstall of @darsi/api runs `prisma generate`.
      - run: pnpm install --frozen-lockfile

      # API and apps consume the built @darsi/shared (dist).
      - run: pnpm --filter @darsi/shared build

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

      - name: Migrate test database
        run: pnpm --filter @darsi/api db:test:prepare

      - run: pnpm test

      - run: pnpm build

# Local development services. Start: pnpm infra:up · Stop: pnpm infra:down
name: darsi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: darsi
      POSTGRES_PASSWORD: darsi
      POSTGRES_DB: darsi
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darsi -d darsi']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage; production uses Cloudflare R2 / Yandex Object Storage.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: darsi
      MINIO_ROOT_PASSWORD: darsi-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 darsi darsi-secret && mc mb --ignore-existing local/darsi-files
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:

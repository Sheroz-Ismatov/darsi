packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency install scripts by default.
# - @swc/core, esbuild: native binaries come as optional platform packages; postinstall is only a check.
# - prisma packages: apps/api runs `prisma generate` in its own postinstall, which also fetches engines.
ignoredBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma
